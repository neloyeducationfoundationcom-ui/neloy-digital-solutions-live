name: Verify original motion restoration live
on:
  push:
    branches: [restore/original-motion]
    paths: [scripts/verify-restored-motion.mjs, .github/workflows/restore-motion-check.yml]
permissions:
  contents: read
jobs:
  restored-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NELOY_QA_DEPS: /tmp/neloy-restore-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test
        run: |
          npm install --prefix "$NELOY_QA_DEPS" --no-save --no-package-lock playwright@1.56.1
          "$NELOY_QA_DEPS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the restored live pages
        run: node scripts/verify-restored-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-motion-restored-live-evidence
          path: restore-qa-results/
          retention-days: 14
