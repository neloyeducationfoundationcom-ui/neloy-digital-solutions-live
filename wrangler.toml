name = "neloy-digital-solutions-live"
main = "src/worker.js"
compatibility_date = "2026-09-09"
# deploy to the existing public Neloy Digital Solutions Worker

[[d1_databases]]
binding = "DB"
database_name = "neloy-leads"
database_id = "c0b600e8-9b58-497c-ab2a-deeb74ae6576"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/showcase-media/neloy-approved-laptop-podcast.mp4", "/showcase-media/neloy-real-portfolio-laptop-60s.mp4", "/showcase-media/bitcoin-2d-explainer-animation.mp4"]

# redeploy stable homepage entry

# Email connection remains inside the separate private agent.
[[services]]
binding = "CHAT_ALERTS"
service = "neloy-private-agent"
entrypoint = "WebsiteChatAlerts"

[triggers]
crons = ["*/5 * * * *"]
