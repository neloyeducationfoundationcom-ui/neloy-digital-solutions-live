<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Website launch readiness: practical checks before going live</title>
<desc id="desc">Original manual infographic in navy, blue and cyan. Three check columns cover content and navigation, functionality and accessibility, and search and launch checks, connected to a large launch readiness indicator.</desc>
