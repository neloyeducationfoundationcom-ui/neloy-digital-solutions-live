<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Does Your Brand Look Consistent Everywhere?</title>
<desc id="desc">Manual Neloy Digital Solutions brand consistency graphic for website, Facebook, Instagram and LinkedIn.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06172d"/>
    <stop offset="0.58" stop-color="#082747"/>
    <stop offset="1" stop-color="#0a3157"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1110" cy="70" r="190" fill="#0b84d8" opacity=".12"/>
<circle cx="95" cy="600" r="165" fill="#18c7dd" opacity=".06"/>

<text x="70" y="62" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="1.2" fill="#65d7ff">NELOY DIGITAL SOLUTIONS • BRAND CONSISTENCY</text>
<text x="70" y="127" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" fill="#ffffff">Does Your Brand Look</text>
<text x="70" y="181" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800" fill="#ffffff">Consistent Everywhere?</text>
<text x="70" y="222" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#bcd6e9">Your website and social platforms should feel like the same business.</text>

<g filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(70,274)">
    <rect width="245" height="122" rx="22" fill="#ffffff"/>
    <circle cx="49" cy="43" r="24" fill="#0c7fd0"/>
    <text x="49" y="51" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">W</text>
    <text x="88" y="50" font-size="23" font-weight="800" fill="#112b49">Website</text>
    <text x="28" y="91" font-size="16" fill="#587087">Clear identity &amp; services</text>
  </g>

  <g transform="translate(345,274)">
    <rect width="245" height="122" rx="22" fill="#ffffff"/>
    <circle cx="49" cy="43" r="24" fill="#1267d7"/>
    <text x="49" y="51" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">F</text>
    <text x="88" y="50" font-size="23" font-weight="800" fill="#112b49">Facebook</text>
    <text x="28" y="91" font-size="16" fill="#587087">Same brand &amp; contact info</text>
  </g>

  <g transform="translate(620,274)">
    <rect width="245" height="122" rx="22" fill="#ffffff"/>
    <circle cx="49" cy="43" r="24" fill="#0fa9c1"/>
    <text x="49" y="51" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">I</text>
    <text x="88" y="50" font-size="23" font-weight="800" fill="#112b49">Instagram</text>
    <text x="28" y="91" font-size="16" fill="#587087">Consistent visual style</text>
  </g>

  <g transform="translate(895,274)">
    <rect width="235" height="122" rx="22" fill="#ffffff"/>
    <circle cx="49" cy="43" r="24" fill="#0879c6"/>
    <text x="49" y="51" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">in</text>
    <text x="88" y="50" font-size="23" font-weight="800" fill="#112b49">LinkedIn</text>
    <text x="28" y="91" font-size="16" fill="#587087">Same message &amp; services</text>
  </g>
</g>

<g font-family="Arial,Helvetica,sans-serif">
  <rect x="70" y="438" width="1060" height="112" rx="22" fill="#0b365d" stroke="#1d628f" stroke-width="1.5"/>
  <text x="102" y="477" font-size="18" font-weight="700" fill="#6edcff">QUICK CHECK</text>

  <g font-size="24" font-weight="700" fill="#ffffff">
    <circle cx="126" cy="516" r="14" fill="#11b9cf"/>
    <path d="M119 516l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="151" y="524">Logo</text>

    <circle cx="335" cy="516" r="14" fill="#11b9cf"/>
    <path d="M328 516l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="524">Colours</text>

    <circle cx="570" cy="516" r="14" fill="#11b9cf"/>
    <path d="M563 516l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="595" y="524">Message</text>

    <circle cx="822" cy="516" r="14" fill="#11b9cf"/>
    <path d="M815 516l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
