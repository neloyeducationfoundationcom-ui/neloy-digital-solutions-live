<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Website Call-to-Action Clarity: Pressure versus Helpful Next Steps</title>
  <desc id="desc">Manual design illustration with two website panels. Left: too many urgent competing buttons, labelled Hard to choose. Right: one primary Request a website quote button, a secondary View recent projects link, and clear next-step text, labelled Easy to understand.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1734"/><stop offset="1" stop-color="#132E53"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1378F4"/><stop offset="1" stop-color="#095FCD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#123050" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#F4F8FD"/>
  <rect x="0" y="0" width="1200" height="134" fill="url(#navy)"/>
  <rect x="0" y="127" width="1200" height="7" fill="#21C1DF"/>
  <rect x="50" y="24" width="8" height="22" rx="4" fill="#21C1DF"/>
  <text x="72" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="2.1" fill="#D7EAF7">NELOY DIGITAL SOLUTIONS</text>
  <text x="50" y="93" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">A CLEAR CTA, NOT A PUSHY CTA</text>
  <text x="50" y="118" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#BFD0E5">One useful next step can be easier to follow than several competing demands.</text>

  <!-- Left / pushy example -->
  <rect x="50" y="155" width="526" height="352" rx="19" fill="#FFFFFF" stroke="#E2EAF3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="155" width="526" height="62" rx="19" fill="#FEECEC"/>
  <rect x="50" y="197" width="526" height="20" fill="#FEECEC"/>
  <circle cx="87" cy="186" r="17" fill="#E35353"/>
  <path d="M87 177v12" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="87" cy="194" r="2" fill="white"/>
  <text x="117" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#8F2B34">TOO MANY DEMANDS</text>
  <text x="79" y="253" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#152642">Our Amazing Services!</text>
  <text x="79" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#637087">You have to decide right now...</text>
  <rect x="79" y="300" width="222" height="53" rx="10" fill="#DA3A42"/>
  <text x="190" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#FFFFFF">ACT NOW!</text>
  <rect x="314" y="300" width="230" height="53" rx="10" fill="#E46534"/>
  <text x="429" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#FFFFFF">BOOK TODAY!</text>
  <rect x="79" y="365" width="222" height="53" rx="10" fill="#AA4D98"/>
  <text x="190" y="398" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#FFFFFF">GET STARTED!</text>
  <rect x="314" y="365" width="230" height="53" rx="10" fill="#C34C43"/>
  <text x="429" y="398" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#FFFFFF">DON'T MISS OUT!</text>
  <line x1="79" y1="444" x2="543" y2="444" stroke="#E7EAF0"/>
  <circle cx="91" cy="470" r="11" fill="#FEECEC"/>
  <path d="M87 466l8 8m0-8l-8 8" stroke="#BD3940" stroke-width="2.5" stroke-linecap="round"/>
  <text x="110" y="476" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#8F2B34">Hard to know what happens next</text>

  <!-- Right / clear example -->
  <rect x="624" y="155" width="526" height="352" rx="19" fill="#FFFFFF" stroke="#C9E6F7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="624" y="155" width="526" height="62" rx="19" fill="#E7F6FF"/>
  <rect x="624" y="197" width="526" height="20" fill="#E7F6FF"/>
  <circle cx="662" cy="186" r="17" fill="#128EAF"/>
  <path d="M654 186l6 6 11-12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="692" y="192" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#0B5C83">ONE HELPFUL NEXT STEP</text>
  <text x="653" y="253" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#152642">Planning a business website?</text>
  <text x="653" y="279" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#576C82">Tell us what you need and ask for a quote.</text>
  <rect x="653" y="304" width="335" height="58" rx="11" fill="url(#primary)"/>
  <text x="820" y="340" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">Request a website quote</text>
  <path d="M1006 331h83m-10-10 10 10-10 10" stroke="#1B90BF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="653" y="401" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1068C9" text-decoration="underline">View recent website projects</text>
  <line x1="653" y1="440" x2="1120" y2="440" stroke="#E2EDF6"/>
  <circle cx="665" cy="470" r="11" fill="#DFF7ED"/>
  <path d="M660 470l4 4 7-8" fill="none" stroke="#208B67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="684" y="476" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#126E61">Clear destination, lower pressure</text>

  <!-- Lower principle line -->
  <rect x="50" y="530" width="1100" height="70" rx="14" fill="#E7EFF8"/>
  <circle cx="83" cy="565" r="14" fill="#147BEE"/>
  <text x="83" y="570" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="107" y="570" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#122D4E">Specific label</text>
  <line x1="400" y1="550" x2="400" y2="580" stroke="#B9CFE2"/>
  <circle cx="434" cy="565" r="14" fill="#147BEE"/>
  <text x="434" y="570" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="457" y="570" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#122D4E">One primary action</text>
  <line x1="787" y1="550" x2="787" y2="580" stroke="#B9CFE2"/>
  <circle cx="823" cy="565" r="14" fill="#147BEE"/>
  <text x="823" y="570" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="846" y="570" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#122D4E">Honest next step</text>
  <text x="1147" y="621" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end" fill="#5B7794">Neloy Digital Solutions · Manual editorial graphic · 2026</text>
</svg>