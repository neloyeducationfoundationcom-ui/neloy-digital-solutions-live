<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">How many pages does a small business website really need?</title>
<desc id="desc">Manual sitemap-style graphic showing Home connected to About, Services, Portfolio and Contact.</desc>
<rect width="1200" height="630" fill="#071a33"/>
<rect x="0" y="0" width="1200" height="10" fill="#19c6f3"/>
<text x="70" y="78" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#41d7ff" letter-spacing="2">WEBSITE PLANNING GUIDE</text>
<text x="70" y="140" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#ffffff">HOW MANY PAGES DOES A</text>
<text x="70" y="198" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#41d7ff">SMALL BUSINESS WEBSITE NEED?</text>
<text x="70" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c8d9ea">Start with the pages customers actually need.</text>

<rect x="475" y="280" width="250" height="82" rx="14" fill="#ffffff" stroke="#2da7e8" stroke-width="4"/>
<text x="600" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#0c315c">HOME</text>

<line x1="600" y1="362" x2="600" y2="410" stroke="#32d2f4" stroke-width="5"/>
<line x1="190" y1="410" x2="1010" y2="410" stroke="#32d2f4" stroke-width="5"/>

<line x1="190" y1="410" x2="190" y2="445" stroke="#32d2f4" stroke-width="5"/>
<line x1="465" y1="410" x2="465" y2="445" stroke="#32d2f4" stroke-width="5"/>
<line x1="735" y1="410" x2="735" y2="445" stroke="#32d2f4" stroke-width="5"/>
<line x1="1010" y1="410" x2="1010" y2="445" stroke="#32d2f4" stroke-width="5"/>

<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="23" text-anchor="middle">
  <rect x="70" y="445" width="240" height="88" rx="14" fill="#0f3157" stroke="#2da7e8" stroke-width="3"/>
  <text x="190" y="498" fill="#ffffff">ABOUT</text>
  <rect x="345" y="445" width="240" height="88" rx="14" fill="#0f3157" stroke="#2da7e8" stroke-width="3"/>
  <text x="465" y="498" fill="#ffffff">SERVICES</text>
  <rect x="615" y="445" width="240" height="88" rx="14" fill="#0f3157" stroke="#2da7e8" stroke-width="3"/>
  <text x="735" y="498" fill="#ffffff">PORTFOLIO</text>
  <rect x="890" y="445" width="240" height="88" rx="14" fill="#0f3157" stroke="#2da7e8" stroke-width="3"/>
  <text x="1010" y="498" fill="#ffffff">CONTACT</text>
</g>

<text x="70" y="588" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">NELOY DIGITAL SOLUTIONS</text>
<text x="1130" y="588" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9fc0dc">Clarity before complexity.</text>
</svg>