<text x="677" y="386" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#071B33">Does it work well on mobile?</text>
<path d="M1059 378 l6 6 l11 -12" fill="none" stroke="#0B7FD3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="624" y="404" width="474" height="39" rx="10" fill="#F8FBFD"/>
<circle cx="649" cy="424" r="15" fill="#0B7FD3"/>
<text x="649" y="428" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text>
<text x="677" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#071B33">Is content easy to read?</text>
<path d="M1059 422 l6 6 l11 -12" fill="none" stroke="#0B7FD3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="624" y="448" width="474" height="39" rx="10" fill="#EFF7FC"/>
<circle cx="649" cy="468" r="15" fill="#0B7FD3"/>
<text x="649" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">05</text>
<text x="677" y="474" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#071B33">Can visitors contact you easily?</text>
<path d="M1059 466 l6 6 l11 -12" fill="none" stroke="#0B7FD3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="84" y="527" width="1032" height="39" rx="13" fill="#071B33"/>
<text x="600" y="553" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Good design removes friction — not just adds polish.</text>
