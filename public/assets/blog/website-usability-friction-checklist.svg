<text x="84" y="158" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#071B33">Modern Look. Difficult Experience?</text>
<text x="84" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#5B6F82">Five usability checks before you redesign a business website</text>
