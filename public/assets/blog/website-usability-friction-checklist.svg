<text x="677" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#071B33">Is the main message clear?</text>
<path d="M1059 334 l6 6 l11 -12" fill="none" stroke="#0B7FD3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="624" y="360" width="474" height="39" rx="10" fill="#EFF7FC"/>
<circle cx="649" cy="380" r="15" fill="#0B7FD3"/>
