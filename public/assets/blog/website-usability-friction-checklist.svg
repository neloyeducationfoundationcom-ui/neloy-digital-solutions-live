<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="ttl desc">
<title id="ttl">Website Usability Friction Checklist</title>
<desc id="desc">An original manual-style graphic contrasting a modern-looking but confusing webpage with five usability checks: navigation, message, mobile use, readability and contact.</desc>
